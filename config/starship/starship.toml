# Spaceship からの移行設定
# 元の SPACESHIP_PROMPT_ORDER (dir, git, ruby, golang, rust, node, java, docker, venv, exec_time, jobs, char) を再現

format = """
$directory\
$git_branch\
$git_status\
$ruby\
$golang\
$rust\
$nodejs\
$java\
$docker_context\
$python\
$cmd_duration\
$jobs\
$line_break\
$character"""

[directory]
truncation_length = 3
truncate_to_repo = false

[git_branch]
symbol = " "

[git_status]
stashed = ""

[cmd_duration]
min_time = 3_000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold green) "

[jobs]
symbol = "✦ "
